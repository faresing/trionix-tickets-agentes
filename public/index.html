<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trionix Tickets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header><h1>Trionix Tickets</h1></header>
  <div id="msg" class="msg" hidden></div>

  <main>
    <section class="panel">
      <h2>Nuevo ticket</h2>
      <form id="form-ticket">
        <input name="cliente" placeholder="Cliente" required />
        <input name="asunto" placeholder="Asunto" required />
        <select name="prioridad">
          <option value="baja">Baja</option>
          <option value="media" selected>Media</option>
          <option value="alta">Alta</option>
        </select>
        <button>Crear ticket</button>
      </form>

      <h2>Nuevo agente</h2>
      <form id="form-agente">
        <input name="nombre" placeholder="Nombre" required />
        <input name="email" type="email" placeholder="Correo" required />
        <select name="especialidad">
          <option value="general">General</option>
          <option value="redes">Redes</option>
          <option value="software">Software</option>
          <option value="hardware">Hardware</option>
        </select>
        <button>Crear agente</button>
      </form>

      <h2>Agentes</h2>
      <ul id="lista-agentes"></ul>
    </section>

    <section class="panel">
      <h2>Tickets</h2>
      <div class="filtros">
        <select id="f-estado">
          <option value="">Todos los estados</option>
          <option value="abierto">Abiertos</option>
          <option value="resuelto">Resueltos</option>
        </select>
        <select id="f-prioridad">
          <option value="">Todas las prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div id="lista-tickets"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
